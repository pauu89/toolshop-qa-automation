name: Toolshop QA Automation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  automated-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador Chromium
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar tests y generar reporte
        env:
         PYTHONPATH: .
        run: |
          mkdir -p reports
          pytest -v \
            --html=reports/report.html \
            --self-contained-html \
            --screenshot only-on-failure \
            --tracing retain-on-failure \
            --output=test-results
      - name: Guardar reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolshop-html-report
          path: reports/report.html
          if-no-files-found: warn

      - name: Guardar evidencias de fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-evidence
          path: test-results/
          if-no-files-found: ignore
